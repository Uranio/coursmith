<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" role="img" aria-labelledby="t">
  <title id="t">Home electrical panel</title>
  <rect x="10" y="10" width="380" height="500" rx="16" fill="#f1f5f9" stroke="#334155" stroke-width="4"/>
  <g id="meter">
    <rect x="130" y="40" width="140" height="90" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <rect x="150" y="60" width="100" height="30" rx="4" fill="#0f172a"/>
    <text x="200" y="82" font-family="monospace" font-size="18" fill="#4ade80" text-anchor="middle">01234</text>
    <text x="200" y="118" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">kWh</text>
  </g>
  <path d="M200 130 V170" stroke="#334155" stroke-width="4"/>
  <g id="main-switch">
    <rect x="160" y="170" width="80" height="70" rx="6" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
    <rect x="190" y="185" width="20" height="40" rx="3" fill="#b91c1c"/>
  </g>
  <path d="M200 240 V280" stroke="#334155" stroke-width="4"/>
  <g id="rcd">
