    <circle cx="230" cy="315" r="10" fill="#1d4ed8"/>
    <rect x="160" y="295" width="20" height="40" rx="3" fill="#1d4ed8"/>
  </g>
  <path d="M200 350 V380 M80 380 H320 M80 380 V400 M160 380 V400 M240 380 V400 M320 380 V400" stroke="#334155" stroke-width="4" fill="none"/>
  <g id="breakers">
    <rect x="55" y="400" width="50" height="80" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <rect x="135" y="400" width="50" height="80" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <rect x="215" y="400" width="50" height="80" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
    <rect x="295" y="400" width="50" height="80" rx="5" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  </g>
